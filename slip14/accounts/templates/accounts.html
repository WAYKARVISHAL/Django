<!DOCTYPE html>
<html>
<head>
    <title>Accounts</title>
</head>
<body>

<h1>Account Details</h1>

<table border="1" cellpadding="10">

    <tr>
        <th>Name</th>
        <th>Balance</th>
    </tr>

    {% for account in accounts %}
    <tr>
        <td>{{ account.name }}</td>
        <td>{{ account.balance }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
