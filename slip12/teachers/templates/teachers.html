<!DOCTYPE html>
<html>
<head>
    <title>Teacher List</title>
</head>
<body>

<h1>Teacher Details</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>Qualification</th>
        <th>Experience</th>
    </tr>

    {% for teacher in teachers %}
    <tr>
        <td>{{ teacher.name }}</td>
        <td>{{ teacher.qualification }}</td>
        <td>{{ teacher.experience }} years</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
