<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

<h1>Login Page</h1>

<form method="POST">
    {% csrf_token %}

    <label>Username:</label>
    <input type="text" name="username"  autocomplete="off">

    <br><br>

    <label>Password:</label>
    <input type="password" name="password">

    <br><br>

    <button type="submit">Login</button>
</form>

<br>

{% if message %}
    <h2>{{ message }}</h2>
{% endif %}

</body>
</html>
