<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>

<h1>All Products</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Product Model</th>
        <th>Product Name</th>
    </tr>

    {% for product in products %}
    <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.product_model }}</td>
        <td>{{ product.product_name }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No products found.</td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="{% url 'home' %}">Back to Home</a>

</body>
</html>
