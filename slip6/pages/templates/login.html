<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h1>Login Page</h1>

{% if message %}
    <h2>{{ message }}</h2>
{% endif %}

<form method="POST">

    {% csrf_token %}

    Username:
    <input type="text" name="username">

    <br><br>

    Password:
    <input type="password" name="password">

    <br><br>

    <input type="submit" value="Login">

</form>

</body>
</html>
